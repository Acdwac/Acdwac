<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS League Manager</title>
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #131b2e;
            --bg-card: #1a233a;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2e3a59;
            --radius-sm: 6px;
            --radius-md: 12px;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.5;
            padding: 24px 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* Top Bar & Header */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Navigation Tabs */
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background-color: var(--bg-card);
            padding: 6px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
        }

        /* Card Styles */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-card);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 18px;
        }

        /* Standings Table */
        .table-container {
            overflow-x: auto;
        }

        table.standings-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.9rem;
        }

        table.standings-table th,
        table.standings-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        table.standings-table th {
            background-color: var(--bg-secondary);
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        table.standings-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        table.standings-table td.pos {
            color: var(--accent-yellow);
            font-weight: 800;
        }

        table.standings-table td.pts {
            font-weight: 800;
            color: var(--accent-cyan);
        }

        /* Fixture Cards (Read-only) */
        .round-title {
            font-size: 1rem;
            color: var(--accent-blue);
            margin: 20px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--border-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fixture-card {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .fixture-team {
            flex: 1;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .fixture-team.home { text-align: right; }
        .fixture-team.away { text-align: left; }

        .score-badge {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            font-weight: 800;
            font-size: 1rem;
            padding: 4px 14px;
            border-radius: 20px;
            margin: 0 12px;
            min-width: 70px;
            text-align: center;
        }

        .score-badge.pending {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Buttons & Forms */
        .btn {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .btn-admin {
            background-color: var(--bg-card);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
        }

        .btn-admin:hover {
            background-color: var(--accent-cyan);
            color: #000;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
        }

        .btn-success {
            background-color: var(--accent-green);
            color: #000;
        }

        .btn-danger {
            background-color: var(--accent-red);
            color: #fff;
        }

        /* Backend Drawer */
        .admin-drawer {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-secondary);
            border-left: 2px solid var(--accent-cyan);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
            padding: 24px;
            z-index: 1000;
            overflow-y: auto;
        }

        .admin-drawer.open { display: block; }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: var(--radius-sm);
            outline: none;
        }

        .backend-score-input {
            width: 50px !important;
            text-align: center;
            font-weight: 700;
            padding: 4px !important;
        }

        .team-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            list-style: none;
        }

        .team-tag {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remove-team-btn {
            color: var(--accent-red);
            cursor: pointer;
            font-weight: bold;
        }

        .admin-fixture-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-card);
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            body { padding: 12px 8px; }
            .header h1 { font-size: 1.6rem; }
            .card { padding: 16px; }
            .fixture-team { font-size: 0.85rem; }
            .score-badge { min-width: 55px; font-size: 0.85rem; padding: 2px 8px; }
            table.standings-table th, table.standings-table td { padding: 8px 4px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Bar with Backend Access Button -->
    <div class="top-bar">
        <button class="btn btn-admin" onclick="toggleAdminDrawer(true)">⚙️ Backend Admin Console</button>
    </div>

    <!-- Public Header -->
    <div class="header">
        <h1 id="publicLeagueTitle">🎮 DLS Premier League</h1>
        <p>Official League Standings & Match Results</p>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-nav">
        <button class="tab-btn active" id="tabTableBtn" onclick="switchTab('table')">📊 Standings Table</button>
        <button class="tab-btn" id="tabFixturesBtn" onclick="switchTab('fixtures')">⚽ Fixtures & Results</button>
    </div>

    <!-- Section 1: Standings Table View -->
    <div id="tableView" class="card">
        <h2 class="card-title">League Table</h2>
        <div class="table-container">
            <table class="standings-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th style="text-align: left;">Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GF</th>
                        <th>GA</th>
                        <th>GD</th>
                        <th>Pts</th>
                    </tr>
                </thead>
                <tbody id="publicStandingsBody">
                    <tr><td colspan="10" style="color: var(--text-muted);">No standings data available</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Section 2: Fixtures & Results View -->
    <div id="fixturesView" class="card" style="display: none;">
        <h2 class="card-title">Match Results & Schedule</h2>
        <div id="publicFixturesList">
            <p style="text-align: center; color: var(--text-muted);">No fixtures scheduled.</p>
        </div>
    </div>
</div>

<!-- BACKEND ADMIN DRAWER -->
<div class="admin-drawer" id="adminDrawer">
    <div class="drawer-header">
        <h2 style="color: var(--accent-cyan); font-size: 1.2rem;">⚙️ Backend Management</h2>
        <button class="btn btn-danger" style="padding: 4px 8px;" onclick="toggleAdminDrawer(false)">✕ Close</button>
    </div>

    <!-- 1. League Setup -->
    <div class="form-group">
        <label>League Name</label>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="adminLeagueInput" placeholder="Enter League Title">
            <button class="btn btn-primary" onclick="saveLeagueNameBackend()">Save</button>
        </div>
    </div>

    <!-- 2. Team Management -->
    <div class="form-group">
        <label>Add Teams to Backend</label>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="adminTeamInput" placeholder="Team Name (e.g. Real Madrid)">
            <button class="btn btn-primary" onclick="addTeamBackend()">Add</button>
        </div>
        <ul class="team-tags" id="adminTeamList"></ul>
    </div>

    <!-- 3. Generate Fixtures -->
    <div class="form-group" style="margin-top: 20px;">
        <button class="btn btn-success" style="width: 100%;" onclick="generateFixturesBackend()">
            🔄 Generate / Reset Fixtures
        </button>
    </div>

    <!-- 4. Result Entry -->
    <div class="form-group" style="margin-top: 24px;">
        <label>Enter Match Results (Backend)</label>
        <div id="adminFixturesContainer">
            <p style="color: var(--text-muted); font-size: 0.85rem;">Generate fixtures first to enter scores.</p>
        </div>
    </div>
</div>

<script>
    // Initial Backend Database State with Default Results Pre-loaded
    let backendDatabase = {
        leagueName: "DLS Champions League",
        teams: ["Real Madrid", "FC Barcelona", "Man City", "PSG"],
        matches: []
    };

    // Initialize with sample pre-entered results
    function initDefaultData() {
        backendDatabase.matches = [
            { id: 0, round: 1, homeTeam: "Real Madrid", awayTeam: "PSG", homeScore: 3, awayScore: 1 },
            { id: 1, round: 1, homeTeam: "FC Barcelona", awayTeam: "Man City", homeScore: 2, awayScore: 2 },
            { id: 2, round: 2, homeTeam: "Real Madrid", awayTeam: "FC Barcelona", homeScore: 1, awayScore: 0 },
            { id: 3, round: 2, homeTeam: "PSG", awayTeam: "Man City", homeScore: null, awayScore: null },
            { id: 4, round: 3, homeTeam: "Man City", awayTeam: "Real Madrid", homeScore: null, awayScore: null },
            { id: 5, round: 3, homeTeam: "FC Barcelona", awayTeam: "PSG", homeScore: null, awayScore: null }
        ];
    }

    // App Startup
    window.onload = function() {
        initDefaultData();
        renderPublicView();
        renderAdminDrawer();
    };

    // Navigation Tab Switcher
    function switchTab(tab) {
        document.getElementById('tabTableBtn').classList.toggle('active', tab === 'table');
        document.getElementById('tabFixturesBtn').classList.toggle('active', tab === 'fixtures');
        document.getElementById('tableView').style.display = tab === 'table' ? 'block' : 'none';
        document.getElementById('fixturesView').style.display = tab === 'fixtures' ? 'block' : 'none';
    }

    function toggleAdminDrawer(open) {
        document.getElementById('adminDrawer').classList.toggle('open', open);
    }

    /* ==========================================================================
       PUBLIC READ-ONLY FRONTEND RENDERERS
       ========================================================================== */

    function renderPublicView() {
        // Render Header Title
        document.getElementById('publicLeagueTitle').innerText = `🎮 ${backendDatabase.leagueName}`;

        // Render Standings Table
        renderPublicStandings();

        // Render Fixtures & Results
        renderPublicFixtures();
    }

    function renderPublicStandings() {
        let stats = {};
        backendDatabase.teams.forEach(t => {
            stats[t] = { played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
        });

        backendDatabase.matches.forEach(m => {
            if (m.homeScore !== null && m.awayScore !== null) {
                const home = stats[m.homeTeam];
                const away = stats[m.awayTeam];

                if (home && away) {
                    home.played++; away.played++;
                    home.gf += m.homeScore; home.ga += m.awayScore;
                    away.gf += m.awayScore; away.ga += m.homeScore;

                    if (m.homeScore > m.awayScore) {
                        home.won++; home.pts += 3; away.lost++;
                    } else if (m.homeScore < m.awayScore) {
                        away.won++; away.pts += 3; home.lost++;
                    } else {
                        home.drawn++; away.drawn++; home.pts += 1; away.pts += 1;
                    }
                }
            }
        });

        Object.keys(stats).forEach(t => { stats[t].gd = stats[t].gf - stats[t].ga; });

        const sorted = Object.keys(stats).sort((a, b) => {
            if (stats[b].pts !== stats[a].pts) return stats[b].pts - stats[a].pts;
            if (stats[b].gd !== stats[a].gd) return stats[b].gd - stats[a].gd;
            return stats[b].gf - stats[a].gf;
        });

        const tbody = document.getElementById('publicStandingsBody');
        if (sorted.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" style="color: var(--text-muted);">No teams registered</td></tr>`;
            return;
        }

        tbody.innerHTML = sorted.map((team, idx) => {
            const s = stats[team];
            return `
                <tr>
                    <td class="pos">${idx + 1}</td>
                    <td style="text-align: left; font-weight: 600;">${team}</td>
                    <td>${s.played}</td>
                    <td>${s.won}</td>
                    <td>${s.drawn}</td>
                    <td>${s.lost}</td>
                    <td>${s.gf}</td>
                    <td>${s.ga}</td>
                    <td>${s.gd}</td>
                    <td class="pts">${s.pts}</td>
                </tr>
            `;
        }).join('');
    }

    function renderPublicFixtures() {
        const container = document.getElementById('publicFixturesList');
        if (backendDatabase.matches.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No fixtures generated yet.</p>`;
            return;
        }

        let html = '';
        let currentRound = 0;

        backendDatabase.matches.forEach(m => {
            if (m.round !== currentRound) {
                currentRound = m.round;
                html += `<div class="round-title">Round ${currentRound}</div>`;
            }

            const isPlayed = m.homeScore !== null && m.awayScore !== null;
            const scoreText = isPlayed ? `${m.homeScore} - ${m.awayScore}` : `VS`;
            const badgeClass = isPlayed ? 'score-badge' : 'score-badge pending';

            html += `
                <div class="fixture-card">
                    <span class="fixture-team home">${m.homeTeam}</span>
                    <span class="${badgeClass}">${scoreText}</span>
                    <span class="fixture-team away">${m.awayTeam}</span>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    /* ==========================================================================
       BACKEND ADMIN FUNCTIONS
       ========================================================================== */

    function renderAdminDrawer() {
        document.getElementById('adminLeagueInput').value = backendDatabase.leagueName;
        renderAdminTeamList();
        renderAdminFixturesInput();
    }

    function saveLeagueNameBackend() {
        const val = document.getElementById('adminLeagueInput').value.trim();
        if (val) {
            backendDatabase.leagueName = val;
            renderPublicView();
        }
    }

    function addTeamBackend() {
        const input = document.getElementById('adminTeamInput');
        const team = input.value.trim();
        if (team && !backendDatabase.teams.includes(team)) {
            backendDatabase.teams.push(team);
            input.value = '';
            renderAdminTeamList();
            renderPublicView();
        }
    }

    function removeTeamBackend(teamName) {
        backendDatabase.teams = backendDatabase.teams.filter(t => t !== teamName);
        renderAdminTeamList();
        renderPublicView();
    }

    function renderAdminTeamList() {
        const ul = document.getElementById('adminTeamList');
        ul.innerHTML = backendDatabase.teams.map(t => `
            <li class="team-tag">
                ${t}
                <span class="remove-team-btn" onclick="removeTeamBackend('${t}')">✕</span>
            </li>
        `).join('');
    }

    // Round-Robin Generator Algorithm
    function generateFixturesBackend() {
        if (backendDatabase.teams.length < 2) {
            alert("Add at least 2 teams to generate fixtures.");
            return;
        }

        backendDatabase.matches = [];
        let list = [...backendDatabase.teams];
        if (list.length % 2 !== 0) list.push("BYE");

        const numRounds = list.length - 1;
        const halfSize = list.length / 2;

        for (let round = 0; round < numRounds; round++) {
            for (let i = 0; i < halfSize; i++) {
                const home = list[i];
                const away = list[list.length - 1 - i];

                if (home !== "BYE" && away !== "BYE") {
                    backendDatabase.matches.push({
                        id: backendDatabase.matches.length,
                        round: round + 1,
                        homeTeam: home,
                        awayTeam: away,
                        homeScore: null,
                        awayScore: null
                    });
                }
            }
            list.splice(1, 0, list.pop());
        }

        renderAdminFixturesInput();
        renderPublicView();
    }

    function renderAdminFixturesInput() {
        const container = document.getElementById('adminFixturesContainer');
        if (backendDatabase.matches.length === 0) {
            container.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem;">No fixtures available.</p>`;
            return;
        }

        let html = '';
        let currentRound = 0;

        backendDatabase.matches.forEach(m => {
            if (m.round !== currentRound) {
                currentRound = m.round;
                html += `<div style="font-weight:700; color:var(--accent-blue); margin:10px 0 4px 0;">Round ${currentRound}</div>`;
            }

            html += `
                <div class="admin-fixture-row">
                    <span style="flex:1; text-align:right; font-weight:600;">${m.homeTeam}</span>
                    <div style="margin: 0 8px; display:flex; gap:4px; align-items:center;">
                        <input type="number" min="0" class="backend-score-input" value="${m.homeScore ?? ''}" 
                            onchange="updateScoreBackend(${m.id}, 'home', this.value)">
                        -
                        <input type="number" min="0" class="backend-score-input" value="${m.awayScore ?? ''}" 
                            onchange="updateScoreBackend(${m.id}, 'away', this.value)">
                    </div>
                    <span style="flex:1; text-align:left; font-weight:600;">${m.awayTeam}</span>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function updateScoreBackend(matchId, type, val) {
        const match = backendDatabase.matches.find(m => m.id === matchId);
        if (!match) return;

        const score = val === '' ? null : parseInt(val, 10);
        if (type === 'home') match.homeScore = score;
        if (type === 'away') match.awayScore = score;

        // Sync updates directly to public frontend view
        renderPublicView();
    }
</script>

</body>
</html>
